services:
  - type: web
    name: little-day-birthday-wisher
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_ID
        sync: false
      - key: ADMIN_PASSWORD
        sync: false


